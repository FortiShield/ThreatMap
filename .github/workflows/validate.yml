name: Validate

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: validate-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: "Validate"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          experimental: true # Necessary for custom backend plugins
          # This repo is itself the toolshed plugin; cached plugin clones go stale. Tool installs are fast (~5s), so skip the cache.
          cache: false

      - name: Install dependencies
        run: pnpm install

      - name: Build eslint-config
        run: pnpm -r --if-present build

      - name: Run validation
        run: mise validate
